name: week7_clean_notes
description: "Week 7 — refactor Offline Notes (Minggu 5) ke Clean Architecture feature-first."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + dependency injection (wiring DI terpusat di provider).
  flutter_riverpod: ^3.4.3

  # Navigasi deklaratif + konstanta rute.
  go_router: ^18.0.2

  # Sumber data jaringan (fitur posts: cache-first read).
  dio: ^5.11.1

  # Sumber data lokal (fitur notes: SQLite).
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1

  # Sumber data preferensi (fitur settings).
  shared_preferences: ^2.5.6

  # Formatting murni di lib/core/format.dart.
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
